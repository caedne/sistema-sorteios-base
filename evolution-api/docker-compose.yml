version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dkingadmin
      POSTGRES_DB: evolution
    ports:
      - "5432:5432"
    volumes:
      - evolution_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: evolution_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - evolution_cache:/data

  mysql:
    image: mysql:8.0
    container_name: mysql_sorteios
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dkingadmin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  evolution_db:
  evolution_cache:
  mysql_data: